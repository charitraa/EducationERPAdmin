    <link rel="preconnect" href="https://fonts.googleapis.com" />

      CoolAdmin's real stylesheet chain (Bootstrap 5 -> legacy theme -> modern
      "app" overlay), vendored as static files in public/vendor/cooladmin/ —

      CoolAdmin doesn't ship, etc.) can safely layer on top.
    -->

    <link href="/vendor/cooladmin/bootstrap.min.css" rel="stylesheet" />
    <link href="/vendor/cooladmin/css/theme.css" rel="stylesheet" />
    <link href="/vendor/cooladmin/css/app.css" rel="stylesheet" />

  </head>
